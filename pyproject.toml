[build-system]
requires = ["setuptools>=68"]         # PEP 660 editable support ke liye naya setuptools
build-backend = "setuptools.build_meta"

[project]
name = "automated-research-report-generation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.0.2",
    "langchain_community==0.4.1",
    "langchain_core==1.0.4",
    "tavily-python==0.7.13",
    "wikipedia==1.4.0",
    "langchain-openai==1.0.3",
    "langchain-google-genai==3.0.3",
    "langchain-groq==1.0.1",
    "structlog==25.5.0",
    "python-docx==1.2.0",
    "reportlab==4.4.5",
    "fastapi==0.121.3",
    "uvicorn==0.38.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
    "sqlalchemy==2.0.44",
    "bcrypt==5.0.0",
    "passlib==1.7.4",
    "python-multipart==0.0.20",
    "structlog>=25.4"
]


# Optional: authors, license
authors = [{ name = "Aryan" }]
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["research_and_analysis"]
include = ["automated_research_report_generation"]

